<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeando - Linha do Tempo Metroferroviária</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Top Left Container (Header & Search) -->
    <div class="top-left-panel" id="header-container">
        <button class="toggle-panel-btn" id="toggle-header" title="Ocultar Painel">▲</button>
        <header class="glass-panel" id="header-content">
            <img src="Logo-removebg-preview.png" alt="Mapeando" class="logo-img">
            <h1 class="title">Evolução Metroferroviária</h1>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Buscar estação...">
                <ul id="search-results" class="search-results hidden"></ul>
            </div>
        </header>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Timeline Slider -->
    <div class="timeline-panel glass-panel" id="timeline-container">
        <button class="toggle-panel-btn toggle-timeline" id="toggle-timeline" title="Ocultar Linha do Tempo">▼</button>
        <div id="timeline-content">
            <div class="timeline-controls">
                <button id="play-pause-btn" class="play-btn">▶</button>
                <div class="slider-wrapper">
                    <div class="slider-header">
                        <span id="start-year">1974</span>
                        <span id="current-year-display" class="highlight-year">2026</span>
                        <span id="end-year">2026</span>
                    </div>
                    <input type="range" id="time-slider" min="1974" max="2026" value="2026" step="1">
                </div>
            </div>
            <p class="slider-hint">Arraste ou dê Play para ver a evolução da rede</p>
        </div>
    </div>

    <!-- Layer Controls (Custom) -->
    <div class="controls-panel glass-panel" id="controls-container">
        <button class="toggle-panel-btn toggle-controls" id="toggle-controls" title="Ocultar Controles">▶</button>
        <div id="controls-content">
            
            <!-- Status Obra -->
            <div class="accordion open" id="acc-status">
                <div class="accordion-header">Cenário (Status Obra)</div>
                <div class="accordion-body" id="status-container">
                    <!-- Injected via JS -->
                </div>
            </div>

            <!-- Camadas Visíveis -->
            <div class="accordion open" id="acc-geometrias">
                <div class="accordion-header">Geometrias Visíveis</div>
                <div class="accordion-body" id="geometry-container">
                    <label class="line-pill">
                        <input type="checkbox" value="Line" class="filter-geo-cb" checked>
                        <span>➖ Traçados (Linhas)</span>
                    </label>
                    <label class="line-pill">
                        <input type="checkbox" value="Point" class="filter-geo-cb" checked>
                        <span>📍 Estações (Pontos)</span>
                    </label>
                    <label class="line-pill">
                        <input type="checkbox" value="Polygon" class="filter-geo-cb" checked>
                        <span>🛑 Áreas (Polígonos)</span>
                    </label>
                </div>
            </div>

            <!-- Modals and Lines (Dynamic Accordions) -->
            <div id="accordion-container">
                <!-- Injected via JS -->
            </div>
            
        </div>
    </div>

    <!-- Custom Tooltip (Hover) -->
    <div id="custom-tooltip" class="glass-panel hidden"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Data as JS -->
    <script src="data/linhas.js"></script>
    <script src="data/poligonos.js"></script>
    <script src="data/pontos.js"></script>

    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
